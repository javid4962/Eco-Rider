services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ecoride-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoride_dev
      POSTGRES_PASSWORD: ecoride_dev_secret
      POSTGRES_DB: ecoride_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoride_dev -d ecoride_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecoride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
  redis_data:

